# Dependabot will run on day 10 of each month at 01:22 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: "daily"
      time: "01:22"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 15
    cooldown:
      default: 7
    assignees:
      - meistermopper
    ignore:
      - dependency-name: "@types/node" # Ignore major version updates for @types/node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: "daily"
      time: "01:22"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 15
    cooldown:
      default: 7
    assignees:
      - 'meistermopper'
