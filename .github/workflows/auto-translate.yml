name: Auto-Translate

on:
  push:
    branches:
      - main
    paths:
      - 'admin/i18n/en.json'
      - 'io-package.json'

jobs:
  translate:
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      contains(github.event.head_commit.message, 'chore: auto-translate') == false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Translate Adapter
        run: npm run translate

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: auto-translate i18n files [skip ci]'
          file_pattern: 'admin/i18n/*.json io-package.json'
